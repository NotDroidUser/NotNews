[versions]
activity = "1.10.1"
activityCompose = "1.10.1"
agp = "8.13.2"
appcompat = "1.7.1"
coreKtx = "1.16.0"
composeBom = "2024.09.00"
commonsCodecVer = "1.15"
composeHilt="1.2.0"
constraintlayout = "2.2.1"
dagger="2.56.2"
espressoCore = "3.6.1"
glide="4.16.0"
coilKt="3.3.0"
jsoup = "1.19.1"
junit = "4.13.2"
junitVersion = "1.2.1"
kotlin = "2.2.21"
kotlinKsp = "2.3.4"
lifecycle = "2.9.1"
lifecycleRuntimeKtx = "2.9.1"
material = "1.12.0"
navigation = "2.9.0"
preference = "1.2.1"
readabilityVer="2.0.0-jitpack-beta"
refreshLayout="1.1.0"
retrofit="2.11.0"
room="2.7.1"


[libraries]
#androidxml
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-core-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "refreshLayout" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-common = { group = "androidx.room", name = "room-common", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

#compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"  }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
#online pictures
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilKt" }
coil-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coilKt" }
#hilt+compose
compose-hilt = { group="androidx.hilt", name="hilt-navigation-compose", version.ref="composeHilt" }



#base 64
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodecVer" }
#online pictures
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
#scraping
jsoup = { group="org.jsoup", name="jsoup", version.ref = "jsoup" }
readability4j= { group = "com.github.NotDroidUser", name = "Readability4J", version.ref = "readabilityVer" }
#api
retrofit2= { group="com.squareup.retrofit2", name="retrofit", version.ref="retrofit" }
retrofit2-converter-gson= { group="com.squareup.retrofit2", name="converter-gson", version.ref="retrofit" }
#dagger + hilt
google-dagger = { group="com.google.dagger", name="dagger", version.ref="dagger" }
google-dagger-compiler = { group="com.google.dagger", name="dagger-compiler", version.ref="dagger" }
google-hilt = { group="com.google.dagger", name="hilt-android", version.ref="dagger" }
google-hilt-compiler = { group="com.google.dagger", name="hilt-compiler", version.ref="dagger" }
#jsoup
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kotlinKsp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
