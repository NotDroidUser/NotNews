[versions]
agp = "8.10.1"
jsoup = "1.19.1"
kotlin = "2.1.21"
kotlinKsp = "2.1.21-2.0.2"
navigation = "2.9.0"
lifecycle = "2.9.1"
coreKtx = "1.16.0"
junit = "4.13.2"
